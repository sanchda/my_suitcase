[package]
name = "bark"
version = "0.1.0"
edition = "2021"
description = "Post a short, ID-tagged message to a Discord webhook from any script."

[[bin]]
name = "bark"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
