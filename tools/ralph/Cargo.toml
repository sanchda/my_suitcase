[package]
name = "ralph"
version = "0.1.0"
edition = "2021"
description = "External autonomous loop for Claude Code and Codex — fresh-context iterations with budgets, timeouts, and no-progress escalation."

[[bin]]
name = "ralph"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
regex = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
