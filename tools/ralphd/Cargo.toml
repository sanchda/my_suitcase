[package]
name = "ralphd"
version = "0.1.0"
edition = "2021"
description = "Discord control bridge for ralph autonomous loops — one channel per loop."

[[bin]]
name = "ralphd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
serenity = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[profile.release]
opt-level = "s"
