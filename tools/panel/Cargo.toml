[package]
name = "panel"
version = "0.1.0"
edition = "2021"
description = "Ensemble pairwise ranking — decorrelated one-shot voters, all-pairs Copeland tally."

[[bin]]
name = "panel"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
